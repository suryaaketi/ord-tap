<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ORD Tap · Printable NFC and QR sign</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--blue:#007aff;--label:#000;--label-2:rgba(60,60,67,.62)}
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:#f2f2f7;color:var(--label);-webkit-font-smoothing:antialiased}
    .tools{max-width:820px;margin:0 auto;padding:20px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .tools label{font-size:15px;font-weight:600}
    .tools select{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:0;background:#fff;min-height:44px}
    .tools button,.tools a{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:var(--blue);color:#fff;text-decoration:none;cursor:pointer}
    .tools a{background:rgba(120,120,128,.12);color:var(--blue)}
    .url{flex-basis:100%;font-size:13px;color:var(--label-2);word-break:break-all}
    .url code{font-size:14px;color:var(--label)}
    /* The sign: US Letter portrait, readable from about two meters. */
    .sign{width:8.5in;min-height:11in;margin:0 auto 40px;background:#fff;padding:.6in .6in .5in;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.12)}
    .here{display:flex;align-items:center;gap:18px}
    .dot{width:64px;height:64px;border-radius:50%;background:var(--blue);border:8px solid #cfe4ff;flex-shrink:0}
    .here h1{font-size:64px;line-height:1;letter-spacing:-.03em;margin:0}
    .where{font-size:30px;font-weight:600;margin:24px 0 4px;letter-spacing:-.01em}
    .level{font-size:22px;color:var(--label-2);margin:0}
    .tap{display:grid;grid-template-columns:1fr 3.4in;gap:.4in;align-items:center;margin:.5in 0 .35in}
    .nfc{border:4px solid var(--label);border-radius:28px;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:20px}
    .nfc svg{width:120px;height:120px;stroke:var(--label);stroke-width:1.6;fill:none;stroke-linecap:round}
    .nfc b{display:block;font-size:30px;margin-top:10px}
    .nfc span{font-size:18px;color:var(--label-2)}
    .qr svg{width:100%;height:auto;display:block}
    .qr p{text-align:center;font-size:18px;font-weight:600;margin:8px 0 0}
    .find{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
    .no{font-size:20px;color:var(--label-2);margin:0}
    .foot{margin-top:auto;padding-top:.3in;border-top:2px solid #e5e5ea;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--label-2)}
    .foot b{color:var(--label)}
    @media print{body{background:#fff}.tools{display:none}.sign{box-shadow:none;margin:0;width:auto;min-height:auto;height:10in;padding:0}@page{size:letter;margin:.5in}}
    @media (max-width:860px){.sign{width:auto;min-height:0;padding:24px}.here h1{font-size:44px}.tap{grid-template-columns:1fr}.where{font-size:24px}}
  </style>
  <script type="module" src="ord/sign.js"></script>
</head>
<body>
  <div class="tools">
    <label for="sign-start">Sign location</label>
    <select id="sign-start"></select>
    <button type="button" id="print">Print sign</button>
    <a href="./" id="open">Open this link</a>
    <p class="url">Write this URL to the NFC tag as a URL / URI record: <code id="tag-url"></code></p>
  </div>
  <article class="sign" id="sign" aria-live="polite"></article>
</body>
</html>
